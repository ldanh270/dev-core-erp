# Render Blueprint specification for DevCore ERP
# Automatically enables Pull Request Preview Environments like Vercel
previewsEnabled: true
previewsExpireAfterDays: 3

services:
  - type: web
    name: devcore-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && npx prisma generate
    startCommand: pnpm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
