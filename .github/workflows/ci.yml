name: CI & Quality Gate

# Trigger on PR and push to main/dev branches
on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

# Cancel redundant in-progress runs on the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Check code formatting with Prettier
  format-check:
    name: Format Check (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify code formatting
        run: pnpm format:check

  # 2. Check code style and rules with ESLint & Stylelint
  lint-check:
    name: Lint Check (ESLint & Stylelint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linters
        run: pnpm lint

  # 3. Check TypeScript types across backend and frontend
  type-check:
    name: Type Check (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir backend exec prisma generate

      - name: Run TypeScript typecheck
        run: pnpm typecheck

  # 4. Quality Gate: verify all quality checks passed before allowing PR merge
  quality-gate:
    name: CI Quality Gate & Merge Protection
    needs:
      - format-check
      - lint-check
      - type-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.format-check.result }}" != "success" ] || \
             [ "${{ needs.lint-check.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ]; then
            echo "[ERROR] CI Quality Gate Failed! One or more checks failed:"
            echo "  - Format Check (Prettier):         ${{ needs.format-check.result }}"
            echo "  - Lint Check (ESLint & Stylelint): ${{ needs.lint-check.result }}"
            echo "  - Type Check (TypeScript):         ${{ needs.type-check.result }}"
            exit 1
          fi
          echo "[SUCCESS] All code quality checks passed! PR is ready to merge."
